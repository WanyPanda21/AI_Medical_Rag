
name: Deploy Medical RAG Backend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "lambda_function.py"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set AWS Variables
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION }}"

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "REGION=$REGION" >> $GITHUB_ENV
          echo "FUNCTION_NAME=medical-rag-backend" >> $GITHUB_ENV
          echo "ROLE_NAME=medical-rag-lambda-role" >> $GITHUB_ENV
          echo "REPOSITORY=medical-rag-backend" >> $GITHUB_ENV

      # Create Lambda execution role automatically
      - name: Create Lambda Execution Role
        run: |

          cat > trust-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }]
          }
          EOF

          if ! aws iam get-role --role-name $ROLE_NAME >/dev/null 2>&1; then

            aws iam create-role \
              --role-name $ROLE_NAME \
              --assume-role-policy-document file://trust-policy.json

          fi

          aws iam attach-role-policy \
            --role-name $ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

          ROLE_ARN=$(aws iam get-role \
            --role-name $ROLE_NAME \
            --query Role.Arn \
            --output text)

          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

          sleep 15

      # Create ECR repository
      - name: Create ECR Repository
        run: |

          if ! aws ecr describe-repositories \
            --repository-names $REPOSITORY >/dev/null 2>&1; then

            aws ecr create-repository \
              --repository-name $REPOSITORY

          fi

          REPOSITORY_URI=$(aws ecr describe-repositories \
            --repository-names $REPOSITORY \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "REPOSITORY_URI=$REPOSITORY_URI" >> $GITHUB_ENV

      # Login to ECR
      - name: Login to Amazon ECR
        run: |

          aws ecr get-login-password --region $REGION | \
            docker login \
            --username AWS \
            --password-stdin $REPOSITORY_URI

      # Generate Dockerfile during workflow
      - name: Create Lambda Dockerfile
        run: |

          cat > Dockerfile <<'EOF'
          FROM public.ecr.aws/lambda/python:3.11

          WORKDIR ${LAMBDA_TASK_ROOT}

          COPY requirements.txt .

          RUN pip install --no-cache-dir \
              --target ${LAMBDA_TASK_ROOT} \
              anthropic \
              qdrant-client \
              pypdf \
              && pip install --no-cache-dir \
              --target ${LAMBDA_TASK_ROOT} \
              --no-deps \
              sentence-transformers

          RUN pip install --no-cache-dir \
              --target ${LAMBDA_TASK_ROOT} \
              --index-url https://download.pytorch.org/whl/cpu \
              torch

          RUN pip install --no-cache-dir \
              --target ${LAMBDA_TASK_ROOT} \
              --no-deps \
              transformers \
              tokenizers \
              huggingface-hub \
              safetensors \
              scikit-learn \
              scipy \
              numpy \
              Pillow

          COPY src/ ${LAMBDA_TASK_ROOT}/src/
          COPY lambda_function.py ${LAMBDA_TASK_ROOT}/

          CMD ["lambda_function.lambda_handler"]
          EOF

      # Build container image
      - name: Build Lambda Image
        run: |

          docker build \
            --platform linux/amd64 \
            -t medical-rag-backend:latest .

      # Push image to ECR
      - name: Push Image to ECR
        run: |

          docker tag medical-rag-backend:latest \
            $REPOSITORY_URI:latest

          docker push $REPOSITORY_URI:latest

      # Configure Lambda environment
      - name: Prepare Environment Variables
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        run: |

          python - <<'PY'
          import os
          import json

          names = [
              "QDRANT_URL",
              "QDRANT_API_KEY",
              "QDRANT_COLLECTION_NAME",
              "ANTHROPIC_API_KEY"
          ]

          config = {
              "Variables": {
                  name: os.environ[name]
                  for name in names
              }
          }

          with open("lambda-env.json", "w") as f:
              json.dump(config, f)
          PY

      # Create or update Lambda
      - name: Create or Update Lambda
        run: |

          if aws lambda get-function \
            --function-name $FUNCTION_NAME >/dev/null 2>&1; then

            echo "Updating Lambda container image..."

            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $REPOSITORY_URI:latest

            aws lambda wait function-updated-v2 \
              --function-name $FUNCTION_NAME

            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --timeout 29 \
              --memory-size 4096 \
              --environment file://lambda-env.json

          else

            echo "Creating Lambda function..."

            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$REPOSITORY_URI:latest \
              --role $ROLE_ARN \
              --timeout 29 \
              --memory-size 4096 \
              --environment file://lambda-env.json

          fi

          aws lambda wait function-active-v2 \
            --function-name $FUNCTION_NAME

      # Create API Gateway
      - name: Create API Gateway
        run: |

          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='medical-rag-api'].ApiId | [0]" \
            --output text)

          if [ "$API_ID" = "None" ] || [ -z "$API_ID" ]; then

            cat > cors.json <<'EOF'
          {
            "AllowOrigins": ["http://localhost:8501"],
            "AllowMethods": ["POST"],
            "AllowHeaders": ["content-type"]
          }
          EOF

            API_ID=$(aws apigatewayv2 create-api \
              --name medical-rag-api \
              --protocol-type HTTP \
              --cors-configuration file://cors.json \
              --query ApiId \
              --output text)

          fi

          echo "API_ID=$API_ID" >> $GITHUB_ENV

      # Connect API Gateway with Lambda
      - name: Configure API Integration
        run: |

          LAMBDA_ARN=$(aws lambda get-function \
            --function-name $FUNCTION_NAME \
            --query Configuration.FunctionArn \
            --output text)

          INTEGRATION_ID=$(aws apigatewayv2 get-integrations \
            --api-id $API_ID \
            --query "Items[?IntegrationUri=='$LAMBDA_ARN'].IntegrationId | [0]" \
            --output text)

          if [ "$INTEGRATION_ID" = "None" ] || [ -z "$INTEGRATION_ID" ]; then

            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id $API_ID \
              --integration-type AWS_PROXY \
              --integration-uri $LAMBDA_ARN \
              --payload-format-version 2.0 \
              --timeout-in-millis 29000 \
              --query IntegrationId \
              --output text)

          fi

          ROUTE_ID=$(aws apigatewayv2 get-routes \
            --api-id $API_ID \
            --query "Items[?RouteKey=='POST /ask'].RouteId | [0]" \
            --output text)

          if [ "$ROUTE_ID" = "None" ] || [ -z "$ROUTE_ID" ]; then

            aws apigatewayv2 create-route \
              --api-id $API_ID \
              --route-key "POST /ask" \
              --target "integrations/$INTEGRATION_ID"

          else

            aws apigatewayv2 update-route \
              --api-id $API_ID \
              --route-id $ROUTE_ID \
              --target "integrations/$INTEGRATION_ID"

          fi

          aws apigatewayv2 create-stage \
            --api-id $API_ID \
            --stage-name '$default' \
            --auto-deploy 2>/dev/null || true

      # Allow API Gateway to invoke Lambda
      - name: Allow API Gateway Invocation
        run: |

          aws lambda add-permission \
            --function-name $FUNCTION_NAME \
            --statement-id apigateway-invoke \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:$REGION:$ACCOUNT_ID:$API_ID/*/POST/ask" \
            || echo "Permission already exists."

      # Display endpoint
      - name: Display API URL
        run: |

          API_URL=$(aws apigatewayv2 get-api \
            --api-id $API_ID \
            --query ApiEndpoint \
            --output text)

          echo "## Medical RAG Deployment" >> $GITHUB_STEP_SUMMARY
          echo "API URL: ${API_URL}/ask" >> $GITHUB_STEP_SUMMARY
