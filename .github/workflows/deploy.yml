
name: Deploy Medical RAG Backend

on:
  push:
    branches:
      - main
    paths:
      - 'lambda_function.py'
      - 'template.yml'
      - 'requirements.txt'
      - 'src/generator.py'
      - 'src/retrieval.py'
      - 'src/embeddings.py'
      - 'src/__init__.py'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. AWS SAM
      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      # 4. AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 5. Build Lambda
      - name: Validate SAM Template
        run: sam validate --lint --template-file template.yml

      - name: SAM Build
        run: sam build --template-file template.yml

      
      - name: Check Repository Files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Searching for SAM templates:"
          find . -maxdepth 3 -type f \( -name "template.yml" -o -name "template.yaml" \)

          if [ ! -f template.yml ]; then
            echo "ERROR: template.yml missing from repository root"
            exit 1
          fi

      - name: Validate SAM Template
        run: sam validate --lint --template-file ./template.yml

      - name: SAM Build
        run: sam build --template-file ./template.yml


      # 6. Automatically recover failed CloudFormation stack
      - name: Check and Recover CloudFormation Stack
        shell: bash
        run: |

          STACK_NAME="medical-rag-stack"
          REGION="ap-southeast-2"

          echo "Checking CloudFormation stack..."

          set +e

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null)

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then

            echo "Stack does not exist. Fresh deployment will proceed."

          else

            echo "Current stack status: $STACK_STATUS"

            if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then

              echo "Failed stack detected."
              echo "Deleting failed CloudFormation stack..."

              aws cloudformation delete-stack \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

              echo "Waiting for stack deletion..."

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

              echo "Failed stack deleted successfully."

            elif [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then

              echo "Stack deletion already in progress."

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

            elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || \
                 [ "$STACK_STATUS" = "UPDATE_COMPLETE" ] || \
                 [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then

              echo "Stack is in a deployable state."

            else

              echo "Stack is in an unexpected state: $STACK_STATUS"
              echo "Stopping deployment to avoid deleting existing resources."
              exit 1

            fi

          fi

      # 7. Deploy
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name medical-rag-stack \
            --region ap-southeast-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              QdrantUrl="${{ secrets.QDRANT_URL }}" \
              QdrantApiKey="${{ secrets.QDRANT_API_KEY }}" \
              QdrantCollectionName="${{ secrets.COLLECTION_NAME }}" \
              AnthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
              ClaudeModel="${{ vars.CLAUDE_MODEL }}"

