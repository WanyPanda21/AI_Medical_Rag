
name: Deploy Medical RAG Backend

on:
  push:
    branches:
      - main
    paths:
      - 'lambda_function.py'
      - 'template.yml'
      - 'requirements.txt'
      - 'src/generator.py'
      - 'src/retrieval.py'
      - 'src/embeddings.py'
      - 'src/__init__.py'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Debug repository structure
      - name: Debug Repository Structure
        run: |
          pwd
          ls -la

          if [ ! -f "./template.yml" ]; then
            echo "ERROR: template.yml NOT FOUND"
            exit 1
          fi

          echo "template.yml found successfully"

      # 3. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 4. AWS SAM
      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      # 5. AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 6. Validate template
      - name: Validate SAM Template
        run: sam validate --lint --template-file ./template.yml

      # 7. Build Lambda
      - name: SAM Build
        run: sam build --template-file ./template.yml

      # 8. Check existing stack BEFORE recovery
      - name: Check Previous CloudFormation Failures
        shell: bash
        run: |

          STACK_NAME="medical-rag-stack"
          REGION="ap-southeast-2"

          echo "Checking CloudFormation stack..."

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" >/dev/null 2>&1; then

            echo "Previous CloudFormation failure events:"

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

          else
            echo "No existing stack found."
          fi

      
      # 9. Check CloudFormation Stack Status
      - name: Check and Recover CloudFormation Stack
        shell: bash
        run: |
          STACK_NAME="medical-rag-stack"
          REGION="ap-southeast-2"

          set -e

          echo "Checking CloudFormation stack..."

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Current stack status: $STACK_STATUS"

          case "$STACK_STATUS" in

            NOT_FOUND)
              echo "No existing stack. Fresh deployment can proceed."
              ;;

            ROLLBACK_COMPLETE)
              echo "Deleting failed stack..."

              aws cloudformation delete-stack \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

              echo "Failed stack removed."
              ;;

            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              echo "Stack is ready for deployment."
              ;;

            REVIEW_IN_PROGRESS)
              echo "Stack is in REVIEW_IN_PROGRESS."
              echo "Checking available CloudFormation changesets..."

              aws cloudformation list-change-sets \
                --stack-name "$STACK_NAME" \
                --region "$REGION" \
                --output table

              echo "Checking recent stack events..."

              aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --region "$REGION" \
                --max-items 15 \
                --output table

              echo "Deployment stopped safely. Review the pending changeset before proceeding."
              exit 1
              ;;

            *)
              echo "Stack is currently in $STACK_STATUS."
              echo "Waiting or investigating is required."
              exit 1
              ;;
          esac


      # 10. Deploy
      - name: SAM Deploy
        run: |

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name medical-rag-stack \
            --region ap-southeast-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              QdrantUrl="${{ secrets.QDRANT_URL }}" \
              QdrantApiKey="${{ secrets.QDRANT_API_KEY }}" \
              QdrantCollectionName="${{ secrets.COLLECTION_NAME }}" \
              AnthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
              ClaudeModel="${{ vars.CLAUDE_MODEL }}"

      # 11. Diagnose deployment failure
      - name: Diagnose Deployment Failure
        if: failure()
        shell: bash
        run: |

          echo "Checking latest CloudFormation deployment errors..."

          aws cloudformation describe-stack-events \
            --stack-name medical-rag-stack \
            --region ap-southeast-2 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true
