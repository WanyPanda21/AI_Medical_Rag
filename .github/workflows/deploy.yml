
name: Deploy Medical RAG Backend

on:
  push:
    branches:
      - main
    paths:
      - 'lambda_function.py'
      - 'template.yml'
      - 'requirements.txt'
      - 'src/generator.py'
      - 'src/retrieval.py'
      - 'src/embeddings.py'
      - 'src/__init__.py'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Debug repository structure
      - name: Debug Repository Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Root directory contents:"
          ls -la

          echo "All YAML files:"
          find . -type f \( -name "*.yml" -o -name "*.yaml" \)

          echo "Git tracked template files:"
          git ls-files | grep -i 'template' || true

          if [ -f "./template.yml" ]; then
            echo "FOUND template.yml"
          else
            echo "ERROR: template.yml NOT FOUND"
            exit 1
          fi

      # 3. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 4. AWS SAM
      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      # 5. AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 6. Validate template
      - name: Validate SAM Template
        run: sam validate --lint --template-file ./template.yml

      # 7. Build Lambda
      - name: SAM Build
        run: sam build --template-file ./template.yml

      # 8. Recover failed CloudFormation stack
      - name: Check and Recover CloudFormation Stack
        shell: bash
        run: |

          STACK_NAME="medical-rag-stack"
          REGION="ap-southeast-2"

          set +e

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null)

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then

            echo "Stack does not exist. Fresh deployment will proceed."

          else

            echo "Current stack status: $STACK_STATUS"

            if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then

              echo "Deleting failed stack..."

              aws cloudformation delete-stack \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

              echo "Stack deleted successfully."

            elif [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$REGION"

            elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || \
                 [ "$STACK_STATUS" = "UPDATE_COMPLETE" ] || \
                 [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then

              echo "Stack is ready for deployment."

            else

              echo "Unexpected stack status: $STACK_STATUS"
              exit 1

            fi

          fi

      # 9. Deploy
      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name medical-rag-stack \
            --region ap-southeast-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              QdrantUrl="${{ secrets.QDRANT_URL }}" \
              QdrantApiKey="${{ secrets.QDRANT_API_KEY }}" \
              QdrantCollectionName="${{ secrets.COLLECTION_NAME }}" \
              AnthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
              ClaudeModel="${{ vars.CLAUDE_MODEL }}"
