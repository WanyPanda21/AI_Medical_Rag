
name: Deploy PharmaCare AI to AWS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "template.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:

  deploy:
    name: Deploy Lambda and AWS Infrastructure
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Prepare Lambda Package
        run: |
          rm -rf lambda_package

          mkdir -p lambda_package

          cp -r backend lambda_package/

          cp requirements.txt lambda_package/requirements.txt

      - name: Validate SAM Template
        run: |
          sam validate --template-file template.yml

      - name: Build Lambda
        run: |
          sam build --template-file template.yml

      - name: Deploy to AWS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_COLLECTION: ${{ secrets.COLLECTION_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |

          sam deploy \
            --stack-name pharmacare-ai-dev \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AnthropicApiKey="$ANTHROPIC_API_KEY" \
              QdrantApiKey="$QDRANT_API_KEY" \
              QdrantUrl="$QDRANT_URL" \
              QdrantCollection="${QDRANT_COLLECTION:-medical_knowledge}" \
              ClaudeModel="${CLAUDE_MODEL:-claude-haiku-5-5}"