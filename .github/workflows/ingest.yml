
name: RAG PDF Ingestion

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/chunking.py'
      - 'src/embeddings.py'
      - 'src/qdrant_ingestion.py'
      - 'main.py'
      - 'requirements-ingestion.txt'
      - '.github/workflows/ingest.yml'

jobs:
  ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-ingestion.txt

      - name: Verify Dependencies
        run: |
          python -c "import onnxruntime; print('ONNX Runtime:', onnxruntime.__version__)"
          python -c "import optimum; print('Optimum installed successfully')"
          python -c "from pypdf import PdfReader; print('PyPDF installed successfully')"
          python -c "from sentence_transformers import SentenceTransformer; print('Sentence Transformers installed successfully')"

      - name: Run PDF Ingestion
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}

        run: python main.py
