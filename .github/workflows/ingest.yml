name: PharmaCare Medical Document Ingestion

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/**"
      - "src/chunking.py"
      - "src/embeddings.py"
      - "src/qdrant_ingestion.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/ingest_documents.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-medical-documents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ingestion files
        run: |
          set -e
          test -f main.py
          test -f data/diseases_symptoms_medicines.pdf
          test -f src/chunking.py
          test -f src/embeddings.py
          test -f src/qdrant_ingestion.py

      - name: Validate Qdrant configuration
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_COLLECTION_NAME: ai_medicine_test
        run: |
          python -c "import os; assert os.getenv('QDRANT_API_KEY'), 'QDRANT_API_KEY is missing'; assert os.getenv('QDRANT_URL'), 'QDRANT_URL is missing'; assert os.getenv('QDRANT_COLLECTION_NAME'), 'QDRANT_COLLECTION_NAME is missing'; print('Qdrant settings validated')"

      - name: Run PDF ingestion
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_COLLECTION_NAME: ai_medicine_test
          PYTHONUNBUFFERED: "1"
        run: python -u main.py
