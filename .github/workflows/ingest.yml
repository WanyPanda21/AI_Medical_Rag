
name: PharmaCare AI - Qdrant PDF Ingestion

on:

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/**"
      - "pharma_rag/ingestion/**"
      - "requirements.txt"
      - ".github/workflows/ingest.yml"

jobs:

  ingestion:
    name: Upload PDF Knowledge to Qdrant
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate PDF
        run: |
          if [ ! -d "data" ]; then
            echo "ERROR: data directory not found"
            exit 1
          fi

          if ! find data -maxdepth 1 -iname "*.pdf" | grep -q .; then
            echo "ERROR: No PDF found inside data/"
            exit 1
          fi

      - name: Ingest PDF into Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.COLLECTION_NAME }}
        run: |
          python -u pharma_rag/ingestion/cloud_ingestion.py