AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PharmaCare AI Medical RAG backend - Lambda, HTTP API Gateway, and DynamoDB

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key used by Claude

  QdrantApiKey:
    Type: String
    NoEcho: true
    Description: Qdrant Cloud API key

  QdrantUrl:
    Type: String
    Description: Qdrant Cloud cluster URL

  QdrantCollectionName:
    Type: String
    Default: ai_medicine_test
    Description: Must match the collection populated by ingest_documents.yml

  ClaudeModel:
    Type: String
    Default: claude-sonnet-4-6

  MedicalRequestsTableName:
    Type: String
    Default: pharmacare-medical-requests-dev

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        CLAUDE_MODEL: !Ref ClaudeModel
        QDRANT_API_KEY: !Ref QdrantApiKey
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_COLLECTION_NAME: !Ref QdrantCollectionName
        MEDICAL_REQUESTS_TABLE: !Ref MedicalRequestsTable

Resources:
  MedicalRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref MedicalRequestsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

  MedicalRagApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:8501
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  MedicalRagFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-medical-rag-api"
      CodeUri: lambda_package/
      Handler: lambda_function.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicalRequestsTable
      Events:
        PatientQuery:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalRagApi
            Path: /patient/query
            Method: POST
            PayloadFormatVersion: "2.0"
        PatientStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalRagApi
            Path: /patient/status/{request_id}
            Method: GET
            PayloadFormatVersion: "2.0"
        DoctorPending:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalRagApi
            Path: /doctor/pending
            Method: GET
            PayloadFormatVersion: "2.0"
        DoctorReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalRagApi
            Path: /doctor/review/{request_id}
            Method: POST
            PayloadFormatVersion: "2.0"
        PatientResponse:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalRagApi
            Path: /patient/response/{request_id}
            Method: GET
            PayloadFormatVersion: "2.0"

Outputs:
  MedicalRagApiUrl:
    Description: API Gateway base URL for Streamlit MEDICAL_API_URL
    Value: !Sub "https://${MedicalRagApi}.execute-api.${AWS::Region}.amazonaws.com"

  MedicalRagFunctionName:
    Description: Deployed Lambda function name
    Value: !Ref MedicalRagFunction

  MedicalRequestsTableName:
    Description: DynamoDB table used for patient requests and doctor review
    Value: !Ref MedicalRequestsTable
