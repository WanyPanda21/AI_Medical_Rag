
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PharmaCare AI - RAG and Doctor Review Backend

Parameters:

  AnthropicApiKey:
    Type: String
    NoEcho: true

  QdrantApiKey:
    Type: String
    NoEcho: true

  QdrantUrl:
    Type: String

  QdrantCollection:
    Type: String
    Default: medical_knowledge

  ClaudeModel:
    Type: String
    Default: claude-haiku-5-5

  ClinicalCasesTableName:
    Type: String
    Default: pharmacare-ai-clinical-cases

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 28
    MemorySize: 1024
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        CLAUDE_MODEL: !Ref ClaudeModel
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_API_KEY: !Ref QdrantApiKey
        QDRANT_COLLECTION: !Ref QdrantCollection
        MEDICAL_CASES_TABLE: !Ref ClinicalCasesTable

Resources:

  # -----------------------------
  # API Gateway
  # -----------------------------

  PharmaCareApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: PharmaCareAI-API
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # -----------------------------
  # DynamoDB Table
  # -----------------------------

  ClinicalCasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ClinicalCasesTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S

      KeySchema:
        - AttributeName: case_id
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true

  # -----------------------------
  # Main Lambda Function
  # -----------------------------

  PharmaCareLambda:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: PharmaCareAI-Backend
      CodeUri: lambda_package/
      Handler: backend.clinical_review.handler.handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClinicalCasesTable

      Events:

        CreateCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /cases
            Method: POST

        GetCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /cases/{case_id}
            Method: GET

        DoctorPendingCases:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /doctor/cases
            Method: GET

        DoctorReviewCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /doctor/cases/{case_id}
            Method: POST

Outputs:

  PharmaCareApiUrl:
    Description: PharmaCare API Gateway URL
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
      - ApiId: !Ref PharmaCareApi

  PharmaCareLambdaArn:
    Description: PharmaCare Lambda ARN
    Value: !GetAtt PharmaCareLambda.Arn

  ClinicalCasesTable:
    Description: DynamoDB Table Name
    Value: !Ref ClinicalCasesTable